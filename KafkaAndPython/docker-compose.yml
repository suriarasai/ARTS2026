# =============================================================================
# Confluent Platform 8.2  (Apache Kafka 4.2)  —  KRaft mode  (no ZooKeeper)
# Tested with: Podman Server 5.8.2 / podman compose (built-in)
#
# Start:   podman compose up -d
# Stop:    podman compose down
# Wipe:    podman compose down -v
#
# Podman notes
#   • Uses fully-qualified image refs (docker.io/) to avoid registry ambiguity.
#   • Explicit "kafka-net" bridge avoids pod-mode DNS issues in rootless Podman.
#   • Volume paths use :z (shared SELinux label) for rootless Podman on Linux.
#     Change :z → :Z for private label, or remove on macOS/Windows.
#   • service_healthy depends_on requires Podman ≥ 5 + podman-compose ≥ 1.2
#     (built-in `podman compose` delegates to podman-compose automatically).
#   • CLUSTER_ID must be a stable 22-char base64 UUID. Regenerate with:
#       python3 -c "import uuid,base64; print(base64.b64encode(uuid.uuid4().bytes).decode().rstrip('='))"
# =============================================================================

name: confluent-kafka-42

services:

  # ── Kafka Broker (KRaft combined: broker + controller) ──────────────────────
  broker:
    image: docker.io/confluentinc/cp-kafka:8.2.0
    hostname: broker
    container_name: broker
    networks:
      - kafka-net
    ports:
      - "9092:9092"      # PLAINTEXT  — Python clients on the host connect here
      - "9101:9101"      # JMX metrics
    environment:
      # ── KRaft identity ──────────────────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk      # stable base64 UUID

      # ── Listeners ───────────────────────────────────────────────────────────
      # PLAINTEXT        — inter-broker / internal (broker:29092)
      # PLAINTEXT_HOST   — host-to-container (localhost:9092)
      # CONTROLLER       — KRaft metadata (broker:29093)
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      # ── Single-node reliability ─────────────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # ── Share groups (KIP-932 — Queues for Kafka, new in 4.2) ──────────────
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # ── Group coordinator (KIP-848 new protocol) ────────────────────────────
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # ── JMX ─────────────────────────────────────────────────────────────────
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      # ── Log storage ─────────────────────────────────────────────────────────
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # ── Metrics interceptors (needed by Control Center) ─────────────────────
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: anonymous
    volumes:
      - broker-data:/var/lib/kafka/data:z
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Schema Registry ──────────────────────────────────────────────────────────
  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:8.2.0
    hostname: schema-registry
    container_name: schema-registry
    networks:
      - kafka-net
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Kafka Connect ────────────────────────────────────────────────────────────
  connect:
    image: docker.io/confluentinc/cp-kafka-connect:8.2.0
    hostname: connect
    container_name: connect
    networks:
      - kafka-net
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group

      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR

      # Metrics interceptors for Control Center visibility
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      CONNECT_CONSUMER_INTERCEPTOR_CLASSES: io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor
      CONNECT_PRODUCER_CONFLUENT_MONITORING_INTERCEPTOR_BOOTSTRAP_SERVERS: broker:29092
      CONNECT_CONSUMER_CONFLUENT_MONITORING_INTERCEPTOR_BOOTSTRAP_SERVERS: broker:29092
    volumes:
      - connect-plugins:/usr/share/confluent-hub-components:z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # ── ksqlDB Server ────────────────────────────────────────────────────────────
  ksqldb-server:
    image: docker.io/confluentinc/cp-ksqldb-server:8.2.0
    hostname: ksqldb-server
    container_name: ksqldb-server
    networks:
      - kafka-net
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: /etc/ksql
      KSQL_BOOTSTRAP_SERVERS: broker:29092
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0

      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_CONNECT_URL: http://connect:8083

      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"

      # Monitoring interceptors
      KSQL_PRODUCER_INTERCEPTOR_CLASSES: io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      KSQL_CONSUMER_INTERCEPTOR_CLASSES: io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── ksqlDB CLI (interactive shell) ───────────────────────────────────────────
  ksqldb-cli:
    image: docker.io/confluentinc/cp-ksqldb-cli:8.2.0
    hostname: ksqldb-cli
    container_name: ksqldb-cli
    networks:
      - kafka-net
    depends_on:
      ksqldb-server:
        condition: service_healthy
    entrypoint: /bin/sh
    tty: true

  # ── REST Proxy ───────────────────────────────────────────────────────────────
  rest-proxy:
    image: docker.io/confluentinc/cp-kafka-rest:8.2.0
    hostname: rest-proxy
    container_name: rest-proxy
    networks:
      - kafka-net
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: rest-proxy
      KAFKA_REST_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Confluent Control Center ─────────────────────────────────────────────────
  control-center:
    image: docker.io/confluentinc/cp-enterprise-control-center:8.2.0
    hostname: control-center
    container_name: control-center
    networks:
      - kafka-net
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      connect:
        condition: service_healthy
      ksqldb-server:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:29092
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: http://connect:8083
      CONTROL_CENTER_KSQL_KSQLDB1_URL: http://ksqldb-server:8088
      CONTROL_CENTER_KSQL_KSQLDB1_ADVERTISED_URL: http://localhost:8088
    restart: unless-stopped

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  broker-data:
  connect-plugins:

# ── Explicit bridge network (required for reliable DNS in rootless Podman) ─────
networks:
  kafka-net:
    driver: bridge